# Checks this VilloMillo plugin on every push and pull request, on Linux and
# Windows, with Python @@PYTHON@@: the Python VilloMillo runs plugins on, so
# newer Python code fails here rather than on a creator's PC. Made by
# python -m clipskitty_sdk new.
name: VilloMillo check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "@@PYTHON@@"

      - name: Install the VilloMillo SDK, with PyYAML and pytest
        # From VilloMillo's repository (its main branch) until the SDK is on PyPI.
        run: python -m pip install "clipskitty-sdk[yaml,test] @ git+https://github.com/UglyCavemanCam/VilloMillo#subdirectory=sdk/python"

      - name: Install FFmpeg, for the sample video
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Check clipskitty.yaml and the code
        run: python -m clipskitty_sdk validate .

      - name: Run it on the sample video
        if: runner.os == 'Linux'
        run: python -m clipskitty_sdk run . --sample

      - name: Tests
        # On Windows there is no FFmpeg here, so the tests that need the
        # sample video are skipped; the ones that need only its transcript run.
        run: python -m pytest -q
