# Profile for your first channel: long-form podcast conversations in the style of
# The Joe Rogan Experience. This file tells the research engine what "fits".

id: rogan
display_name: "Rogan Clips"
autopilot: review            # review = you approve; auto is Phase 7

niche:
  definition: >-
    Long-form, free-flowing podcast conversations in the style of The Joe Rogan Experience:
    comedians, fighters, scientists, authors and public figures telling stories, arguing and
    joking, with plenty of moments that make sense on their own.
  include:
    - standalone stories and anecdotes
    - strong opinions, debates and disagreements
    - jokes and funny exchanges
    - surprising claims or revelations from a guest
    - MMA, fighting and sports talk
    - science, health and fitness discussion
    - stand-up comedians talking shop
  exclude:
    - music performances
    - trailers and ads
    - live streams
    - compilations made from other channels' videos
    - news bulletins

research:
  watch_channels:
    - handle: "@joerogan"
      note: "The Joe Rogan Experience (the channel's title is PowerfulJRE)"

  # Keyword searches. They use YouTube's scarce search allowance (about 100 a day),
  # so keep this list short. They find similar long-form podcasts and what is trending
  # around JRE. Edit freely; Claude will suggest better ones from Phase 2.
  topics:
    - "joe rogan experience full episode"
    - "joe rogan podcast guest"
    - "joe rogan comedian interview"
    - "joe rogan mma fighter interview"
    - "joe rogan scientist interview"
    - "long form podcast comedian interview"
    - "long form podcast fighter interview"
    - "long form podcast debate"
  max_searches_per_run: 8
  topic_search_days: 7          # only videos published in the last 7 days

  trending: null                # YouTube's trending chart only covers music, movies and gaming
  freshness_hours: 336          # ignore videos older than 14 days
  languages: [en]
  min_duration_min: 20
  max_duration_min: 360
  blocked_title_words: ["#shorts", "live now", "livestream", "reaction"]
  blocked_channel_ids: []

grading:
  min_score: 70                 # confidence score a video needs to be clipped
  min_certainty: 0.6            # how sure the graders must be
  escalate_band: 5              # within 5 points of the line: ask a second opinion (Phase 2)
  weights:
    outlier: 0.20               # views per hour compared with the channel's usual
    momentum: 0.10              # is it speeding up right now
    engagement: 0.10            # likes and comments per view
    niche: 0.20                 # Jev: does it fit the niche
    moments: 0.15               # Jev: standalone moments inside
    appeal: 0.15                # Jev: how many people would care
    hook: 0.10                  # Jev: strength of the hook
