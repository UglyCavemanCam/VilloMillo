# The starting channel: Podcasts. It is read once into an empty database; after that channels are added and
# edited in the dashboard. The id stays "solved" so the YouTube sign-in already saved for it keeps working.
# The Solved campaign rules below move to the Campaigns feature in Phase 7.

id: solved
display_name: "Podcasts"
category: Podcasts
tiktok_handle: "@podscliphouse"
autopilot: review

niche:
  definition: >-
    Clips from podcasts, interviews and talk shows: a clear point, a hard truth, a surprising story or a strong
    opinion that makes sense without the rest of the episode.
  include:
    - a hard truth stated plainly
    - a problem almost everyone has, and the answer
    - a short story with a payoff
    - a strong, surprising or contrarian opinion
  exclude:
    - ad reads and sponsor segments
    - small talk and housekeeping

# The Clipfarm x Solved brief (Google Doc "Mark Manson Clipping Brief"). Only the rules a program can check
# are here; the rest is judged by you when you review a clip.
campaign:
  name: "Clipfarm x Solved with Mark Manson"
  min_s: 20
  max_s: 60
  face_window_s: 5          # Mark's face must be on screen in the first 5 seconds
  require_captions: true    # subtitles on the whole clip
  no_ad_reads: true

posting:
  dry_run: true             # nothing is sent until you turn this off on the channel's page
  platforms:
    youtube_shorts: manual  # by hand until YouTube's audit passes and you switch it to automatic
    tiktok: manual          # by hand until TikTok is connected and audited
  privacy: private
  min_gap_minutes: 0
  daily_cap: 100            # YouTube: 100 posts a day is the channel's limit
  platform_caps:
    tiktok: 15              # TikTok allows about this many a day per account through its API

brand:
  name: Podcasts
  handle: "@cavemancam"          # the faint watermark in the middle of every clip

format: podcast_talk             # the A2 look; see config/villomillo/blueprints.yaml
format_params:
  clean_frame:
    keep_right_of: 0.40625       # the show's own on-screen text sits left of this part of the picture: never show it
