# The starting channel: Podcasts. It is read once into an empty database; after that channels are added and
# edited in the dashboard. The id stays "solved" so the YouTube sign-in already saved for it keeps working.
# The Solved campaign's rules live with the campaign now (Campaigns page).

id: solved
display_name: "Podcasts"
category: Podcasts
autopilot: review

niche:
  definition: >-
    Clips from podcasts, interviews and talk shows: a clear point, a hard truth, a surprising story or a strong
    opinion that makes sense without the rest of the episode.
  include:
    - a hard truth stated plainly
    - a problem almost everyone has, and the answer
    - a short story with a payoff
    - a strong, surprising or contrarian opinion
  exclude:
    - ad reads and sponsor segments
    - small talk and housekeeping

posting:
  dry_run: true             # nothing is sent until you turn this off on the channel's page
  platforms:
    youtube_shorts: manual  # by hand until YouTube's audit passes and you switch it to automatic
  privacy: public
  min_gap_minutes: 10       # each clip waits a random time between these two after the last post
  max_gap_minutes: 20
  auto_post_min_score: 70   # a clip scoring under this waits for your decision instead of posting by itself
  daily_cap: 10             # at most 10 Shorts a day, counted over every channel together
  post_times: ["08:00", "10:00", "12:00", "13:30", "15:00", "17:00", "18:30", "19:45", "20:45", "21:45"]  # Eastern Time: the busy midday and evening stretches get the most

brand:
  name: Podcasts
  handle: "@cavemancam"          # the faint watermark in the middle of every clip

