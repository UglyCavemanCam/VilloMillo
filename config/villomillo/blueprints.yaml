# Format building blocks: small pieces a template stacks together. See docs/FORMAT-BLUEPRINTS.md and the clip formats plan.
# A template has exactly one framing block, and any text and brand blocks (motion blocks arrive with the effects phase).
#
#   needs         what the clip must supply for the block to apply (words, title, points, takeaway).
#                 A block whose needs are missing is dropped, and the drop is reported.
#   conflicts     blocks it cannot be stacked with.
#   added_value   counts as something the viewer could not get from the plain footage. A template with none is refused:
#                 YouTube reaches less for a crop plus captions.
#   params        defaults for the block itself. How a block looks (fonts, colours, caption style) lives in the template's design.
#
# There are no built-in formats in this file. Templates are made in the Formats page and stored in the database.

blueprints:
  # --- framing: how the footage sits in the 1080x1920 frame -------------------------------------------------------
  face_fill:              # the speaker fills the screen, the crop following their face
    layer: framing
    conflicts: [fit_blur, stacked_webcam, split]
    params: {keep_right_of: 0.0}
  fit_blur:               # the whole picture in the middle of a blurred copy: the safe choice for anything unusual
    layer: framing
    conflicts: [face_fill, stacked_webcam, split]
    params: {}
  stacked_webcam:         # a stream: the webcam in a band on top, the game below it, filling the band
    layer: framing
    conflicts: [face_fill, fit_blur, split]
    params: {webcam_share: 0.38}
  split:                  # two people on one wide shot: the left half on top, the right half below, each filling its band
    layer: framing
    conflicts: [face_fill, fit_blur, stacked_webcam]

  # --- text -------------------------------------------------------------------------------------------------------
  captions:               # the words as they are said, in one of the caption styles
    layer: text
    needs: [words]
  headline:               # the title Claude wrote and Jev checked, over the opening seconds
    layer: text
    needs: [title]
    added_value: true
    params: {base_s: 1.0, per_word_s: 0.4, min_s: 2.5, max_s: 7.0}
  point_chips:            # a label for each point the speaker names, shown while they are on it
    layer: text
    needs: [points]
    added_value: true
  takeaway:               # a one-line conclusion over the last seconds
    layer: text
    needs: [takeaway]
    added_value: true

  # --- brand ------------------------------------------------------------------------------------------------------
  progress_bar_bottom:    # flush with the bottom edge
    layer: brand
    params: {height: 14}
  watermark_center:       # the channel handle, small and faint, in the exact middle
    layer: brand
    params: {alpha: 38, size: 30}
  logo_corner:            # your logo in a corner for the whole clip; pasted and Research clips only, never campaigns
    layer: brand
    needs: [logo]
    params: {margin: 60}
  cta_end:                # your call to action over the last seconds; pasted and Research clips only, never campaigns
    layer: brand
    needs: [cta]
    params: {seconds: 2.6}
