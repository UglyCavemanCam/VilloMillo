# VilloMillo app settings. Edit and restart. Every key is optional; these are the defaults.

database: data/villomillo/villomillo.db

dashboard:
  host: 127.0.0.1          # this PC only. Do not change unless you know why
  port: 8780

# YouTube's own limits are 10,000 general units and 100 searches per day, so these leave room to spare.
budgets:
  youtube_general_units_per_day: 8000
  youtube_search_calls_per_day: 80
  claude_escalations_per_day: 10   # second opinions on borderline videos
  transcript_jev_usd_per_video: 0.01

# No monthly or daily dollar caps. Instead everything pauses when spending SINCE YOUR LAST APPROVAL reaches
# these amounts (or when an account runs out of funds), and the dashboard asks you to approve.
spend_breaker:
  claude_usd: 25.00
  jev_usd: 5.00

# How often each job runs.
schedule:
  watch_every_minutes: 30        # look for new uploads on watched channels
  topics_every_minutes: 720      # keyword searches (these use the scarce search allowance)
  snapshots_every_minutes: 60    # refresh view counts to measure growth
  grade_every_minutes: 15        # grade newly found videos
  grade_batch: 40                # most videos graded per run
  review_every_minutes: 10080    # the weekly Claude review (7 days)
  post_every_minutes: 15         # send approved clips that are due (dry-run unless a channel turns it off)
