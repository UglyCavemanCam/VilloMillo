# The tracks chosen from the YouTube Audio Library (see docs/MUSIC-SHORTLIST.md), and what each is for.
#
# Download each one from YouTube Studio's Audio Library into your Downloads folder, then press "Import from Downloads" on the
# Music tab of the Formats page. The app matches each file by its name ("Title - Artist.mp3") and files it with the mood and
# categories below. A track that is not in this list can still be added with "Add a track" on the same tab.
#
#   mood         one of the library's own moods: calm, inspirational, dramatic, dark, sad, bright, happy, funky, angry, romantic
#   categories   Podcasts, Talks, Stream clips, Other, or Campaigns (clips made for a campaign, where the AI picks the mood)
#   genre        as the library labels it; left blank where it was not recorded

source: YouTube Audio Library
licence: >-
  YouTube Audio Library License: you can use this audio track in any of your videos, including videos that you monetize.
  No attribution is required.
attribution: none

